<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>AES Encrypt / Decrypt</title>

    <link rel="stylesheet" href="css/main.css">

    <!-- CryptoJS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.min.js"></script>

</head>

<body>

<div class="container">

    <h1>🔐 AES Encrypt / Decrypt</h1>

    <p class="subtitle">
        Secure client-side encryption using AES
    </p>


    <div class="grid">


        <!-- Encrypt Card -->

        <div class="card">

            <h2>Encrypt</h2>

            <label>Message</label>

            <textarea 
                id="encryptText"
                placeholder="Enter text to encrypt..."
            ></textarea>


            <label>Password</label>

            <input 
                id="encryptPassword"
                type="password"
                placeholder="Enter password"
            >


            <button onclick="encryptAES()">
                Encrypt
            </button>


            <label>Encrypted Output</label>

            <textarea
                id="encryptedOutput"
                class="output"
                readonly
            ></textarea>


            <button class="secondary"
                    onclick="copyField('encryptedOutput')">
                Copy
            </button>


        </div>




        <!-- Decrypt Card -->

        <div class="card">

            <h2>Decrypt</h2>


            <label>Encrypted Text</label>

            <textarea 
                id="decryptText"
                placeholder="Paste encrypted text..."
            ></textarea>


            <label>Password</label>

            <input 
                id="decryptPassword"
                type="password"
                placeholder="Enter password"
            >


            <button onclick="decryptAES()">
                Decrypt
            </button>


            <label>Decrypted Output</label>

            <textarea
                id="decryptedOutput"
                class="output"
                readonly
            ></textarea>


            <button class="secondary"
                    onclick="copyField('decryptedOutput')">
                Copy
            </button>


        </div>


    </div>


    <footer>
        AES encryption runs locally in your browser.
        No data is sent to any server.
    </footer>


</div>


<script src="js/crypt.js"></script>


</body>

</html>
