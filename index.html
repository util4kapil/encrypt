<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>AES Encrypt / Decrypt</title>

    <link rel="stylesheet" href="css/main.css">

    <!-- CryptoJS CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.min.js"></script>

</head>

<body>

<h2>AES Encrypt</h2>

<label>Text</label><br>
<textarea id="encryptText" rows="5" cols="60"></textarea>
<br><br>

<label>Password</label><br>
<input id="encryptPassword" type="password">
<br><br>

<button onclick="encryptAES()">Encrypt</button>

<br><br>

<label>Encrypted Output</label><br>
<textarea id="encryptedOutput" rows="5" cols="60"></textarea>


<hr>


<h2>AES Decrypt</h2>

<label>Encrypted Text</label><br>
<textarea id="decryptText" rows="5" cols="60"></textarea>
<br><br>

<label>Password</label><br>
<input id="decryptPassword" type="password">
<br><br>

<button onclick="decryptAES()">Decrypt</button>

<br><br>

<label>Decrypted Output</label><br>
<textarea id="decryptedOutput" rows="5" cols="60"></textarea>


<script src="js/crypt.js"></script>

</body>

</html>
